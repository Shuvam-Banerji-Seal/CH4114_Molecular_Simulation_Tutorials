[project]
name = "uv-demo"
version = "0.1.0"
description = "Lennard-Jones demo project for CH4114 tutorial 00 (uv workflow)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uv_demo"]
