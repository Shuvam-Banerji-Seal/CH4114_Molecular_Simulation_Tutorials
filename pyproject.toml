[project]
name = "ch4114-molecular-simulation-tutorials"
version = "0.1.0"
description = "CH4114 Molecular Simulation — hands-on tutorials (Git, GitHub, project organization, uv)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shuvam Banerji Seal" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ch4114"]

[tool.pytest.ini_options]
testpaths = ["tests"]
